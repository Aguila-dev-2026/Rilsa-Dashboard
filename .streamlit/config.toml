[theme]
base = "dark"
primaryColor = "#6D1F2B"
font = "sans-serif"
showSidebarBorder = true
chartCategoricalColors = ["#6D1F2B", "#B36F3D", "#2F6F9F", "#2E6A4D", "#9A5A1A"]

[theme.light]
primaryColor = "#6D1F2B"
backgroundColor = "#F4F0E9"
secondaryBackgroundColor = "#FFFDF8"
textColor = "#171514"
borderColor = "#D8CEC2"
showWidgetBorder = true

[theme.light.sidebar]
backgroundColor = "#ECE4DA"
secondaryBackgroundColor = "#FFFDF8"
textColor = "#171514"
borderColor = "#C9BDB0"

[theme.dark]
primaryColor = "#B36F3D"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#262730"
textColor = "#FAFAFA"
borderColor = "#3B3D49"
showWidgetBorder = true

[theme.dark.sidebar]
backgroundColor = "#1A1C24"
secondaryBackgroundColor = "#262730"
textColor = "#FAFAFA"
borderColor = "#3B3D49"
